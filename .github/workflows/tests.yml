# Authoritative CI gate: runs the pytest suite on every push to main
# and every PR targeting main. Generated by new-repo-ci-bootstrap.sh
# from the in-house baseline (venv/pip/pytest stack).
#
# Budget: private-repo free tier is 2,000 min/month. Single job; `concurrency`
# cancels superseded runs on the same ref so rapid pushes don't stack minutes.
name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run test suite
        run: python -m pytest -q
