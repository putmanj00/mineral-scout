# Fail-closed secret scan. Scans the tracked tree on every push (all branches)
# and every PR to main, failing the check if any file contains a secret.
# Kept separate from tests.yml so a secret finding is reported independently of
# the suite.
#
# NOTE: this job only becomes an *authoritative* gate once the `gitleaks` status
# check is REQUIRED by branch protection on `main` — otherwise a red
# check can be merged over.
name: secrets

on:
  push:
    # All branches: a `git commit --no-verify` secret pushed to a feature
    # branch must be detected at push time, not first when a PR opens.
    branches: ['**']
  pull_request:
    branches: [main]

concurrency:
  group: secrets-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      # Pinned release + sha256 verify so a tampered or truncated download fails
      # the job (fail-closed) instead of silently scanning with a broken tool.
      # `--retry` rides out transient network flakes; any failure here aborts the
      # job. Installed under $RUNNER_TEMP and invoked by full path: the runner
      # user cannot write to /usr/local/bin without sudo, and keeping the binary
      # out of the repo tree means it is never itself scanned.
      - name: Install gitleaks (pinned 8.30.1, checksum-verified)
        run: |
          set -euo pipefail
          VER=8.30.1
          SHA=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          curl -fsSL --retry 5 --retry-all-errors -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz"
          echo "${SHA}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" version

      # Config-integrity, structural layer: parse the TOML and require
      # [extend].useDefault == true, so the built-in ruleset can't be disabled
      # while a single canary-matching custom rule keeps the behavioural canary
      # below green. A real parse (not grep) is immune to this file's comments.
      - name: Config-integrity structural check (extend.useDefault must be true)
        run: |
          python3 -c "import sys,tomllib;c=tomllib.load(open('.gitleaks.toml','rb'));sys.exit(0 if c.get('extend',{}).get('useDefault') is True else 1)" \
            || { echo "::error::.gitleaks.toml does not set [extend].useDefault = true"; exit 1; }

      # Config-integrity CANARY (behavioural). A custom .gitleaks.toml that drops
      # `useDefault = true`, removes rules, or adds a catch-all allowlist would
      # silently detect nothing. Prove the CONFIGURED scanner still fires on a
      # known secret before trusting the scan: feed a canary via stdin and require
      # a detection (rc 1). The token is assembled at runtime so its literal never
      # appears in this tracked workflow file (which would self-trip the scan).
      - name: Config-integrity canary (scanner must detect a known secret)
        run: |
          set -euo pipefail
          canary_prefix='sk_live_'
          canary="mineral-scout-secretscan-canary ${canary_prefix}4eC39HqLyjWDarjtT1zdp7dc"
          set +e
          printf '%s\n' "$canary" | "$RUNNER_TEMP/gitleaks" stdin \
            --config .gitleaks.toml --no-banner --redact --exit-code 1 >/dev/null 2>&1
          rc=$?
          set -e
          [ "$rc" -eq 1 ] || { echo "::error::scanner config canary did not fire (rc=$rc); ruleset gutted or gitleaks error"; exit 1; }

      # `dir` scans the checked-out tree (in CI that is tracked files only). The
      # checkout is throwaway, so we drop suppression files first so NOTHING is
      # skipped:
      #   .gitignore     — gitleaks dir skips ignore-matched paths; removing it
      #                    means a force-added/tracked secret cannot hide behind
      #                    an ignore pattern (e.g. a committed `.env`).
      #   .gitleaksignore — fingerprint suppression is not a sanctioned channel
      #                    here; the only allowlist is .gitleaks.toml.
      # --config pins the repo config (defeats GITLEAKS_CONFIG* env override),
      # --ignore-gitleaks-allow disables `# gitleaks:allow` inline bypasses,
      # --exit-code 1 makes a finding fail the job, --redact keeps secret values
      # out of the CI log while still naming the file + rule.
      - name: Scan tracked tree for secrets (fail-closed)
        run: |
          set -euo pipefail
          rm -f .gitignore .gitleaksignore
          "$RUNNER_TEMP/gitleaks" dir . \
            --config .gitleaks.toml --no-banner --redact --verbose \
            --ignore-gitleaks-allow --exit-code 1
